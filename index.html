const totalCartas = 8;

// ---- JUEGO ----
function nuevaRonda() {
  const game = document.getElementById("game");
  const msg = document.getElementById("message");
  game.innerHTML = "";
  msg.textContent = "Encuentra la carta diferente";
  hablar("Encuentra la carta diferente");

  const tipos = Object.keys(categorias);
  const categoria = tipos[Math.floor(Math.random() * tipos.length)];
  const elementos = categorias[categoria];

  const comun = elementos[Math.floor(Math.random() * elementos.length)];
  let diferente;
  do {
    diferente = elementos[Math.floor(Math.random() * elementos.length)];
  } while (diferente === comun);

  let cartas = [];
  for (let i = 0; i < totalCartas - 1; i++) cartas.push(comun);
  cartas.push(diferente);
  cartas.sort(() => Math.random() - 0.5);

  cartas.forEach(valor => {
    const div = document.createElement("div");
    div.className = "card";
    div.textContent = valor;

    div.onclick = () => {
      const desc = describirCarta(valor, categoria);
      if (valor === diferente) {
        msg.textContent = `Elegiste ${desc}. Es la diferente. ¡Muy bien!`;
        hablar(`Elegiste ${desc}. Es la diferente. Muy bien.`);
      } else {
        msg.textContent = `Elegiste ${desc}. No es la diferente.`;
        hablar(`Elegiste ${desc}. No es la diferente.`);
      }
    };

    game.appendChild(div);
  });
}

// ---- DESCRIPCIÓN PARA VOZ ----
function describirCarta(valor, categoria) {
  if (categoria === "numeros") return "el número " + valor;
  if (categoria === "colores") return "el color " + valor;
  if (categoria === "animales") return "el animal " + valor;
  if (categoria === "comida") return "la comida " + valor;
  if (categoria === "objetos") return "el objeto " + valor;
  if (categoria === "cuerpo") return "la parte del cuerpo " + valor;
  if (categoria === "transporte") return "el transporte " + valor;
  if (categoria === "deportes") return "el deporte " + valor;
  if (categoria === "naturaleza") return "la naturaleza " + valor;
  if (categoria === "banderas") return "la bandera " + valor;
  if (categoria === "caritas") return "la carita " + valor;
  if (categoria === "simbolos") return "el símbolo " + valor;
  if (categoria === "palabras") return "la palabra " + valor;
  return valor;
}
